<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102025"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="favicon.svg"><title>Compteur Frigos</title><style>:root{--i:#ffffff;--m:#cfcfcf;--b:#000000;--p:#0a0a0a;--l:#ffffff;--a:#ffffff}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--i);font:16px/1.45 system-ui,sans-serif}.app{max-width:680px;margin:auto;padding:25px 16px}.brand{font-size:.8rem;font-weight:800;letter-spacing:.1em;color:var(--l)}h1{font-size:2rem;letter-spacing:-.06em;margin:8px 0}.intro,.small{color:var(--m)}.card{background:var(--p);border:1px solid #555555;border-radius:14px;padding:17px;margin:13px 0}label{display:grid;gap:5px;color:var(--m);font-size:.83rem;margin:10px 0}select,input{width:100%;padding:11px;border-radius:8px;border:1px solid #555555;background:#000000;color:var(--i);font:inherit}button{font:inherit;font-weight:750;border:0;border-radius:9px;padding:12px;cursor:pointer}.primary{background:var(--l);color:#000000}.secondary{background:#111111;color:var(--i)}.camera{min-height:180px;border:1px dashed #777777;border-radius:11px;display:grid;place-items:center;overflow:hidden;text-align:center;color:var(--m)}.camera img{display:none;width:100%;max-height:360px;object-fit:contain}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.line{display:grid;grid-template-columns:1fr 82px 34px;gap:8px;align-items:end}.line button{background:#333333;color:white;padding:10px}.hidden{display:none!important}.status{padding:10px;background:#111111;color:var(--a);border-radius:8px}.report{background:#fff;color:#152124;padding:20px}.report table{border-collapse:collapse;width:100%}.report th,.report td{padding:8px 3px;border-bottom:1px solid #d8e1df;text-align:left}.report th:last-child,.report td:last-child{text-align:right}@media print{body{background:white}.app>*:not(#report){display:none!important}.app{max-width:none;padding:0}#report{display:block!important}.report{padding:0}.actions{display:none}}</style><style>h1{letter-spacing:.09em;line-height:1.18;word-spacing:.1em}</style></head><body><main class="app"><div class="brand">FUSE · INVENTAIRE LOCAL</div><h1>Compter un frigo</h1><p class="intro">Photos et relevés restent sur ce téléphone.</p><section class="card"><label>Lieu<select id="bar"><optgroup label="Bars"><option>Bar 1 - Main room</option><option>Bar 2 - Main room</option><option>Bar 3 - Motion</option><option>Bar 4 - Cosmos</option></optgroup><optgroup label="Stocks"><option>Stock toilettes</option><option>Stock principal et réserve vidange</option><option>Réserve alcool</option><option>Stock Bar 1 - Main room</option><option>Stock Bar 2 - Main room</option><option>Stock chambre froide - Bar 2 Main room</option><option>Stock Bar 3 - Motion</option><option>Stock Bar 4 - Cosmos</option><option>Stock escalier - 1er étage</option><option>Stock Motion - sous plancher</option><option>Stock étage Cosmos - sous l'escalier</option></optgroup></select></label><label id="fridgeLabel">Frigo<select id="fridge"><option>Frigo 1</option><option>Frigo 2</option><option>Frigo 3</option><option>Frigo 4</option><option>Frigo 5</option><option>Autre</option></select></label><label id="shelfLabel">Étage — du haut vers le bas<select id="shelf"><option>Étage 1 — haut</option><option>Étage 2</option><option>Étage 3</option><option>Étage 4 — bas</option></select></label></section><section class="card"><b>Photo du frigo</b><p class="small">Photo nette de face. Tu confirmes ensuite les quantités.</p><div class="camera" id="preview"><span>Pas encore de photo</span><img id="photo"></div><div class="actions"><button class="primary" id="camera">Prendre une photo</button><button class="secondary" id="import">Importer</button></div><input class="hidden" id="cameraInput" type="file" accept="image/*" capture="environment"><input class="hidden" id="fileInput" type="file" accept="image/*"></section><section class="card"><div style="display:flex;justify-content:space-between"><b>Boissons comptées</b><button class="secondary" id="add">+ Ligne</button></div><div id="lines"></div></section><button class="primary" style="width:100%" id="save">Enregistrer et préparer le rapport</button><p class="status hidden" id="status"></p><section class="hidden" id="report"><article class="report"><div class="brand" style="color:#000000">FUSE · INVENTAIRE FRIGO</div><h1 id="rTitle"></h1><p id="rMeta"></p><table><thead><tr><th>Boisson</th><th>Quantité</th></tr></thead><tbody id="rRows"></tbody></table></article><div class="actions"><button class="primary" id="print">Exporter en PDF</button><button class="secondary" id="newCount">Nouveau</button></div></section></main><script>const lines=document.querySelector('#lines'),photo=document.querySelector('#photo'),preview=document.querySelector('#preview');function line(){let d=document.createElement('div');d.className='line';d.innerHTML='<label>Boisson<input placeholder="Ex. Jupiler"></label><label>Qté<input type="number" min="0" inputmode="numeric"></label><button>×</button>';d.querySelector('button').onclick=()=>d.remove();lines.append(d)}line();function load(f){let r=new FileReader;r.onload=e=>{photo.src=e.target.result;photo.style.display='block';preview.querySelector('span').style.display='none'};r.readAsDataURL(f)}camera.onclick=()=>cameraInput.click();import.onclick=()=>fileInput.click();cameraInput.onchange=e=>load(e.target.files[0]);fileInput.onchange=e=>load(e.target.files[0]);add.onclick=line;save.onclick=()=>{let d=[...lines.children].map(x=>({n:x.querySelectorAll('input')[0].value,q:x.querySelectorAll('input')[1].value})).filter(x=>x.n);if(!d.length)return alert('Ajoute une boisson.');rTitle.textContent=bar.value+' - '+fridge.value;rMeta.textContent='Inventaire du '+new Date().toLocaleString('fr-BE');rRows.innerHTML=d.map(x=>'<tr><td>'+x.n+'</td><td>'+x.q+'</td></tr>').join('');localStorage.setItem('fuse-last',JSON.stringify(d));report.classList.remove('hidden');status.textContent='Inventaire enregistré localement.';status.classList.remove('hidden');report.scrollIntoView()};print.onclick=()=>window.print();newCount.onclick=()=>location.reload();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js?v=20260924-14');</script><script src="shelves.js?v=20260924-2"></script><script src="checklist.js?v=20260924-2"></script><script src="vendor/onnx/ort.min.js"></script><script src="local-vision.js"></script><script src="catalog.js?v=20260924-2"></script><script src="report-timing.js"></script><script src="products.js"></script><script src="fridges.js?v=20260924-3"></script><script src="logo.js"></script><script src="profile-inventory.js?v=20260924-7"></script><script src="stock-mode.js?v=20260924-2"></script><script src="bahut-mode.js?v=20260924-2"></script><script src="fridge-batch.js?v=20260924-2"></script><script src="location-validation.js"></script><script src="bar-plan.js?v=20260924-7"></script><script src="photo-ui.js?v=20260924-2"></script><script src="live-status.js?v=20260924-2"></script><script src="offline-share.js"></script><script src="final-report.js"></script><script src="comprehensive-report.js"></script><script src="report-export.js?v=20260924-2"></script></body></html>
